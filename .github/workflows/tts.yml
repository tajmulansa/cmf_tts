name: Kokoro TTS

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Text (leave empty to use script.txt)"
        required: false
        default: ""
      voice:
        description: "Voice"
        required: true
        default: "af_heart"
        type: choice
        options:
          - af_heart
          - af_bella
          - af_nicole
          - am_michael
          - am_fenrir
          - am_puck
          - bf_emma
          - bm_george
          - bm_fable
          - hf_alpha
          - hm_omega
      speed:
        description: "Speed (0.8 slow – 1.3 fast)"
        required: true
        default: "1.0"
  push:
    paths:
      - "script.txt"

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache Kokoro model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1

      - name: Generate voice-over
        env:
          TTS_TEXT: ${{ inputs.text }}
          TTS_VOICE: ${{ inputs.voice || 'af_heart' }}
          TTS_SPEED: ${{ inputs.speed || '1.0' }}
        run: python tts.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: voiceover
          path: output/

      - name: Commit MP3 to repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add output/
          git commit -m "Voice-over: $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
          git push
